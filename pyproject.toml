[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
norecursedirs = ["tools", "htmlcov", ".log"]

[tool.coverage.run]
source = ["ai", "core", "database", "games", "utils", "main"]
omit = ["tests/*"]

[tool.coverage.report]
show_missing = true
skip_empty = true

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = [".log"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501", "E402", "E701", "E741", "W291", "W293", "I001"]

[tool.ruff.lint.per-file-ignores]
"tools/qa/*" = ["E", "F", "W", "I"]

[tool.pyright]
include = ["ai", "core", "database", "games", "utils", "tests", "tools", "main.py"]
exclude = ["**/__pycache__", "htmlcov", ".log"]
pythonVersion = "3.10"
